name: Sync projects

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
    inputs:
      repository:
        description: 'Optional allowlisted owner/repository (requires sha)'
        type: string
        required: false
      sha:
        description: 'Full lowercase commit SHA (requires repository)'
        type: string
        required: false
  repository_dispatch:
    types: [portfolio-project-updated]

permissions:
  contents: read

concurrency:
  group: portfolio-project-sync
  cancel-in-progress: false

jobs:
  prepare:
    # Manual runs on another branch must not execute alternate policy or scripts.
    if: github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.prepare.outputs.changed }}
      revision: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate pinned sources and prepare sanitized catalog
        id: prepare
        run: node --experimental-strip-types scripts/content-sync/run.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: main
      - name: Validate generated security batch
        if: steps.prepare.outputs.changed == 'true'
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const {content}=JSON.parse(readFileSync('.content-sync/result.json','utf8')); process.stdout.write(JSON.stringify({version:1,files:[{path:'generated/source.json',content}]}));" > .content-sync/batch.json
          node scripts/security/check-generated.mjs < .content-sync/batch.json
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.changed == 'true'
        with:
          name: validated-projects
          path: .content-sync/result.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  propose:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: validated-projects
          path: .content-sync
      - name: Revalidate artifact and create or update draft proposal
        run: node --experimental-strip-types scripts/content-sync/run.mjs propose
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: main
